apiVersion: v1
kind: Namespace
metadata:
  name: kedr-oom-kill-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oom-kill-demo
  namespace: kedr-oom-kill-demo
data:
  leak.py: |
    """Keep touching and retaining memory until the container is OOM killed."""

    import os
    import time

    MIB = 1024 * 1024
    initial_mib = int(os.environ.get("INITIAL_MIB", "24"))
    step_mib = int(os.environ.get("STEP_MIB", "21"))
    step_seconds = int(os.environ.get("STEP_SECONDS", "60"))

    if min(initial_mib, step_mib, step_seconds) <= 0:
        raise ValueError("INITIAL_MIB, STEP_MIB, and STEP_SECONDS must be positive")

    retained = []
    total_mib = 0

    def allocate(mib):
        global total_mib
        block = bytearray(mib * MIB)
        # Touch every page so the allocation counts toward the memory limit.
        for offset in range(0, len(block), 4096):
            block[offset] = 1
        retained.append(block)
        total_mib += mib
        print(f"retained {total_mib} MiB in {len(retained)} blocks", flush=True)

    allocate(initial_mib)
    next_step = time.monotonic() + step_seconds
    while True:
        time.sleep(max(0, next_step - time.monotonic()))
        allocate(step_mib)
        next_step += step_seconds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-kill-demo
  namespace: kedr-oom-kill-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oom-kill-demo
  template:
    metadata:
      labels:
        app: oom-kill-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oom-kill-demo
          image: python:3.13-slim-bookworm
          command: ["python", "-u", "/app/leak.py"]
          env:
            - name: INITIAL_MIB
              value: "24"
            - name: STEP_MIB
              value: "21"
            - name: STEP_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: oom-kill-demo
