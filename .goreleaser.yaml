version: 2

builds:
  - id: kedr
    main: ./cmd/kedr
    binary: kedr
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/kedify/kedr/internal/cli.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: kedr
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]

homebrew_casks:
  - name: kedr
    ids: [kedr]
    binaries: [kedr]
    homepage: https://github.com/kedify/kedr
    description: Kubernetes CPU and memory resource recommender
    skip_upload: auto
    repository:
      owner: kedify
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # Release binaries are not yet signed and notarized with Apple.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kedr"]
          end

release:
  prerelease: auto

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
